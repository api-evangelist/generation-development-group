description: Generation Development Group Limited (ASX:GDG), founded in 1991, is an ASX-listed Australian diversified financial services company with a market cap of over $2 billion (as at 30 June 2025). It owns Generation Life (investment bonds and lifetime annuities for financial advisers), Lonsec Research and Ratings (qualitative financial research and ratings), and Evidentia Group (managed account solutions for licensees and advisers). Its corporate site publishes investor, governance and shareholder information; no public developer API, documentation or developer portal is published there.

